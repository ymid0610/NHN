<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>틱 택 탕! — web client</title>
<style>
  /* Chrome is built from the Unity project's western UI textures, referenced in
     place rather than copied. Panels and buttons are stretched rather than
     nine-sliced: their corner detail is modest enough to survive it, and the
     alternative is hardcoding slice insets that would silently break if the art
     were regenerated. */
  :root {
    --ink: #f3e4c3;
    --dim: #b39a72;
    --gold: #e8b44a;
    --good: #7dc47d;
    --bad: #e2705f;
    --line: #6b4a2a;
    --ui: '../Assets/Resources/UI/';
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background: #241708 url('../Assets/Resources/UI/WesternLobbyBackgroundGenerated.png') center/cover fixed no-repeat;
    font: 14px/1.55 Georgia, "Times New Roman", serif;
  }
  body::before {
    content: ''; position: fixed; inset: 0; background: rgba(24, 14, 6, .55); pointer-events: none;
  }
  #app { position: relative; display: grid; grid-template-columns: 1fr 330px; height: 100vh; }
  #main { display: flex; flex-direction: column; min-width: 0; }
  #side {
    border-left: 3px solid var(--line); display: flex; flex-direction: column; min-height: 0;
    background: rgba(28, 17, 8, .82);
  }

  header {
    padding: 10px 16px;
    border-bottom: 3px solid var(--line);
    background: rgba(28, 17, 8, .8);
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  header b {
    color: var(--gold); font-size: 20px; letter-spacing: 1px;
    text-shadow: 0 2px 0 #3a2410;
  }
  .dim { color: var(--dim); }
  .pill {
    border: 2px solid var(--line); border-radius: 4px; padding: 1px 10px;
    font-size: 12px; background: rgba(0,0,0,.25);
  }

  #view { flex: 1; overflow: auto; padding: 16px; min-height: 0; }
  canvas {
    width: 100%; display: block; border: 4px solid var(--line); border-radius: 4px;
    box-shadow: 0 8px 26px rgba(0,0,0,.6);
    cursor: none;                 /* the crosshair is drawn on the canvas */
    image-rendering: pixelated;   /* the art is pixel work; keep it crisp */
  }

  button {
    color: #2a1a08; font: 700 14px Georgia, serif; cursor: pointer;
    border: 0; padding: 9px 20px; min-width: 96px;
    background: url('../Assets/Resources/UI/GeneratedButtons/WesternButtonDarkGenerated.png') center/100% 100% no-repeat;
    text-shadow: 0 1px 0 rgba(255, 235, 190, .35);
  }
  button:hover:not(:disabled) {
    background-image: url('../Assets/Resources/UI/GeneratedButtons/WesternButtonDarkHoverGenerated.png');
  }
  button:active:not(:disabled) {
    background-image: url('../Assets/Resources/UI/GeneratedButtons/WesternButtonDarkPressedGenerated.png');
  }
  button:disabled {
    background-image: url('../Assets/Resources/UI/GeneratedButtons/WesternButtonDisabledGenerated.png');
    color: #6b5a44; cursor: default;
  }
  button.primary {
    background-image: url('../Assets/Resources/UI/GeneratedButtons/WesternButtonGoldGenerated.png');
  }
  button.primary:hover:not(:disabled) {
    background-image: url('../Assets/Resources/UI/GeneratedButtons/WesternButtonGoldHoverGenerated.png');
  }
  button.primary:active:not(:disabled) {
    background-image: url('../Assets/Resources/UI/GeneratedButtons/WesternButtonGoldPressedGenerated.png');
  }
  button.danger {
    background-image: url('../Assets/Resources/UI/GeneratedButtons/WesternButtonRedGenerated.png');
  }

  input, select {
    color: var(--ink); font: 14px Georgia, serif; padding: 7px 10px; width: 130px;
    border: 0;
    background: url('../Assets/Resources/UI/GeneratedButtons/WesternInputGenerated.png') center/100% 100% no-repeat;
  }
  input[type=checkbox] { width: auto; background: none; accent-color: var(--gold); }
  input[type=number] { width: 74px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }

  table {
    border-collapse: collapse; width: 100%; margin-top: 10px;
    background: rgba(24, 14, 6, .6); border: 3px solid var(--line);
  }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid rgba(107, 74, 42, .6); }
  th { color: var(--gold); font-weight: 400; font-size: 12px; letter-spacing: .5px; }
  tr.clickable:hover { background: rgba(232, 180, 74, .13); cursor: pointer; }

  #log { flex: 1; overflow: auto; padding: 12px 14px; font-size: 12.5px; min-height: 0; }
  #log div { margin-bottom: 3px; word-break: break-word; }
  #log .ev { color: var(--dim); }
  #log .err { color: var(--bad); }
  #log .ok { color: var(--good); }
  #chatbar { display: flex; gap: 8px; padding: 12px; border-top: 3px solid var(--line); }
  #chatbar input { flex: 1; width: auto; }
  #chatbar select { width: 96px; }

  fieldset {
    border: 3px solid var(--line); margin: 0 0 14px; padding: 12px 14px;
    background: rgba(24, 14, 6, .55);
  }
  legend { color: var(--gold); font-size: 13px; padding: 0 6px; }
  label { font-size: 12.5px; color: var(--dim); }
  .scores { display: flex; gap: 14px; flex-wrap: wrap; }
  .scores span {
    border: 2px solid var(--line); padding: 3px 12px; background: rgba(24, 14, 6, .7);
    color: var(--gold);
  }
  p.dim { max-width: 62ch; }
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <header>
      <b>틱 택 탕!</b>
      <span id="hdrState" class="pill dim">disconnected</span>
      <span id="hdrSession" class="dim"></span>
      <span id="hdrRoom" class="dim"></span>
      <span id="hdrAmmo" class="dim"></span>
      <span id="hdrArt" class="dim"></span>
    </header>
    <div id="view"></div>
  </div>
  <div id="side">
    <div id="log"></div>
    <div id="chatbar">
      <select id="chatChannel">
        <option value="1">global</option>
        <option value="2">room</option>
        <option value="3">instance</option>
      </select>
      <input id="chatText" placeholder="message" autocomplete="off">
    </div>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
