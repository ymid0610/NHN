<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>틱 택 탕! — web client</title>
<style>
  :root {
    --bg: #14161c; --panel: #1d212b; --line: #2c3242; --ink: #e6e9f0;
    --dim: #8b93a7; --accent: #f2b134; --good: #4bbf73; --bad: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  #app { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  #main { display: flex; flex-direction: column; min-width: 0; }
  #side { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

  header {
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  header b { color: var(--accent); }
  .dim { color: var(--dim); }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; }

  #view { flex: 1; overflow: auto; padding: 14px; min-height: 0; }
  canvas { width: 100%; background: #0d0f14; border: 1px solid var(--line); border-radius: 6px; cursor: crosshair; display: block; }

  button, input, select {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #14161c; border-color: var(--accent); font-weight: 700; }
  input { width: 120px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }

  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 400; font-size: 12px; }
  tr.clickable:hover { background: var(--panel); cursor: pointer; }

  #log { flex: 1; overflow: auto; padding: 10px 12px; font-size: 12px; min-height: 0; }
  #log div { margin-bottom: 2px; word-break: break-word; }
  #log .ev { color: var(--dim); }
  #log .err { color: var(--bad); }
  #log .ok { color: var(--good); }
  #chatbar { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
  #chatbar input { flex: 1; width: auto; }
  h2 { font-size: 13px; color: var(--dim); font-weight: 400; margin: 18px 0 4px; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 12px; padding: 10px 12px; }
  legend { color: var(--dim); font-size: 12px; padding: 0 4px; }
  label { font-size: 12px; color: var(--dim); }
  .scores { display: flex; gap: 14px; flex-wrap: wrap; }
  .scores span { border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <header>
      <b>틱 택 탕!</b>
      <span id="hdrState" class="pill dim">disconnected</span>
      <span id="hdrSession" class="dim"></span>
      <span id="hdrRoom" class="dim"></span>
      <span id="hdrAmmo" class="dim"></span>
    </header>
    <div id="view"></div>
  </div>
  <div id="side">
    <div id="log"></div>
    <div id="chatbar">
      <select id="chatChannel">
        <option value="1">global</option>
        <option value="2">room</option>
        <option value="3">instance</option>
      </select>
      <input id="chatText" placeholder="message" autocomplete="off">
    </div>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
